server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    # Chuyển tiếp các header quan trọng
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Giữ nguyên các header xác thực và idempotency
    proxy_pass_request_headers on;

    # Định tuyến API: /products, /orders, /auth, /payments, /health
    location ~ ^/(products|orders|auth|payments|health)(/|$) {
        proxy_pass http://api:3001;
    }

    # Định tuyến tất cả các đường dẫn còn lại sang Web Next.js
    location / {
        proxy_pass http://web:3000;
    }
}

