name: CI

on:
  pull_request:
    branches:
      - some-diagram-and-SRS
      - main

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Pin npm to 11.20.0 (same as team)
        run: npm install -g npm@11.20.0

      - name: Show Node and npm versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run test
        run: npm test

      - name: Run build
        run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm to 11.20.0 (same as team)
        run: npm install -g npm@11.20.0

      - name: Show Node and npm versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run test
        run: npm test

      - name: Run build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001