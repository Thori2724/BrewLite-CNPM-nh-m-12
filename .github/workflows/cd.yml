name: CD

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'
    branches:
      - some-diagram-and-SRS
      - main
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Chạy Database Migration (Prisma deploy)'
        type: boolean
        default: true
      run_smoke_test:
        description: 'Chạy Smoke Test sau triển khai'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 1. Quality Gate: Lint, Test, Build
  # ==========================================
  quality-gate-api:
    name: Quality Gate - API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Pin npm to 11.20.0
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run test
        run: npm test

      - name: Run build
        run: npm run build

  quality-gate-web:
    name: Quality Gate - Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm to 11.20.0
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run test
        run: npm test

      - name: Run build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://brewlite-api.onrender.com' }}

  # ==========================================
  # 2. Build & Push Docker Images to GHCR
  # ==========================================
  build-push-registry:
    name: Docker Build & Push (GHCR)
    needs: [quality-gate-api, quality-gate-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository name for GHCR
        run: |
          echo "IMAGE_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Metadata & Push API Image ---
      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}/brewlite-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/some-diagram-and-SRS' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      # --- Metadata & Push Web Image ---
      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPO }}/brewlite-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/some-diagram-and-SRS' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PRODUCTION_API_URL || 'https://brewlite-api.onrender.com' }}
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  # ==========================================
  # 3. Database Migration (Prisma deploy an toàn)
  # ==========================================
  database-migration:
    name: Database Migration
    needs: [build-push-registry]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_migration }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Pin npm to 11.20.0
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migration Deploy
        env:
          DATABASE_URL: ${{ secrets.RENDER_EXTERNAL_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret RENDER_EXTERNAL_DATABASE_URL chưa được cấu hình. Bỏ qua bước migration tự động từ CI."
            echo "Vui lòng cấu hình RENDER_EXTERNAL_DATABASE_URL trong GitHub Secrets để tự động hóa migration."
          else
            echo "Đang áp dụng migration lên database production..."
            npx prisma migrate deploy
            echo "Migration hoàn tất thành công!"
          fi

  # ==========================================
  # 4. Deploy to Render via Deploy Hook
  # ==========================================
  deploy-production:
    name: Deploy to Render
    needs: [database-migration]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API Deployment (Render Deploy Hook)
        env:
          HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::Secret RENDER_API_DEPLOY_HOOK chưa được cấu hình."
            echo "Nếu Render đã bật Auto-Deploy trên nhánh ${{ github.ref_name }}, Render sẽ tự động build từ commit mới nhất."
          else
            echo "Kích hoạt Deploy Hook cho brewlite-api..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$HOOK_URL")
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "API Deploy Hook phản hồi mã HTTP: $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Kích hoạt deploy API thành công!"
            else
              echo "::error::Gọi API Deploy Hook thất bại với mã: $STATUS"
              exit 1
            fi
          fi

      - name: Trigger Web Deployment (Render Deploy Hook)
        env:
          HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::Secret RENDER_WEB_DEPLOY_HOOK chưa được cấu hình."
            echo "Nếu Render đã bật Auto-Deploy trên nhánh ${{ github.ref_name }}, Render sẽ tự động build từ commit mới nhất."
          else
            echo "Kích hoạt Deploy Hook cho brewlite-web..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$HOOK_URL")
            STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Web Deploy Hook phản hồi mã HTTP: $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "Kích hoạt deploy Web thành công!"
            else
              echo "::error::Gọi Web Deploy Hook thất bại với mã: $STATUS"
              exit 1
            fi
          fi

  # ==========================================
  # 5. Smoke Test & Health Check
  # ==========================================
  smoke-test:
    name: Smoke Test & Health Check
    needs: [deploy-production]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_smoke_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for service deployment & Run Smoke Test
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://brewlite-api.onrender.com' }}
          WEB_URL: ${{ secrets.PRODUCTION_WEB_URL || 'https://brewlite-web.onrender.com' }}
        run: |
          echo "=========================================="
          echo "Bắt đầu Smoke Test hệ thống Production"
          echo "API URL: $API_URL"
          echo "Web URL: $WEB_URL"
          echo "=========================================="

          # --- 1. Smoke Test API GET /health ---
          HEALTH_URL="$API_URL/health"
          echo "Đang kiểm tra API Health Check: $HEALTH_URL"
          
          MAX_RETRIES=10
          RETRY_DELAY=15
          SUCCESS=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Lần thử $i/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$HEALTH_URL" || true)
            echo "HTTP Code trả về: $HTTP_CODE"

            if [ "$HTTP_CODE" -eq 200 ]; then
              BODY=$(cat /tmp/health_response.json)
              echo "Phản hồi API: $BODY"
              if echo "$BODY" | grep -q "ok"; then
                echo "API Health Check THÀNH CÔNG!"
                SUCCESS=1
                break
              fi
            fi

            echo "API chưa sẵn sàng (có thể đang spin up hoặc build). Đợi $RETRY_DELAY giây..."
            sleep $RETRY_DELAY
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::API Health Check THẤT BẠI sau $MAX_RETRIES lần thử!"
            echo "Hệ thống production gặp lỗi hoặc không phản hồi 200 OK."
            echo "Dừng pipeline và yêu cầu thực hiện quy trình ROLLBACK!"
            exit 1
          fi

          # --- 2. Smoke Test Web Home Page ---
          echo "Đang kiểm tra Web Frontend: $WEB_URL"
          WEB_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL" || true)
          echo "Web HTTP Code: $WEB_CODE"

          if [ "$WEB_CODE" -ge 200 ] && [ "$WEB_CODE" -lt 400 ]; then
            echo "Web Frontend truy cập THÀNH CÔNG!"
          else
            echo "::warning::Web Frontend trả về mã: $WEB_CODE. Cần kiểm tra lại trạng thái Render."
          fi

          echo "=========================================="
          echo "Smoke Test hoàn tất thành công!"
          echo "=========================================="

